// ==== SI QUIERES buildscript, PUEDE IR ANTES DE plugins ====
// (opcional) tu bloque buildscript puede quedarse aquí si lo necesitas
buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://s01.oss.sonatype.org' }
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        // dependencias de plugins si hicieran falta
    }
}

// ==== EL BLOQUE plugins DEL ROOT VA ARRIBA Y SOLO UNA VEZ ====
plugins {
    id 'base'      // no pongas 'application' en el root
    id 'eclipse'
    id 'idea'
}
ext {
    appName = 'BlockBreaker2024'
}
// Repos para todos los proyectos
allprojects {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://s01.oss.sonatype.org' }
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }
    // Nombre visible en Eclipse
    eclipse {
        project {
            name = 'BlockBreaker2024-parent'
        }
    }
    idea {
        module {
            outputDir file('build/classes/java/main')
            testOutputDir file('build/classes/java/test')
        }
    }
}

// Configuración común a subproyectos (core, lwjgl3, etc.)
subprojects {
    apply plugin: 'java-library'

    java {
        // Compila con Java 11 (el profe manda)
        toolchain { languageVersion = JavaLanguageVersion.of(11) }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 11
        options.encoding = 'UTF-8'
        options.incremental = true
    }

    // Generar lista de assets antes de processResources (ajusta ruta si lo usas)
    tasks.register('generateAssetList') {
        def assetsFolder = file("${project.rootDir}/assets/")
        inputs.dir(assetsFolder)
        doLast {
            def assetsFile = file("$assetsFolder/assets.txt")
            if (assetsFile.exists()) assetsFile.delete()
            fileTree(assetsFolder).collect { assetsFolder.toPath().relativize(it.toPath()).toString() }.each {
                assetsFile.append(it + System.lineSeparator())
            }
        }
    }
    tasks.named('processResources').configure { dependsOn 'generateAssetList' }
}